<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="100%" stop-color="#FDA085" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Mode Canvas -->
  <rect width="500" height="500" rx="100" fill="#0B0F19" />

  <!-- Background Ambient Glow -->
  <circle cx="250" cy="250" r="140" fill="url(#cyberGrad)" opacity="0.12" filter="url(#subtleGlow)" />

  <!-- Monogram Group (IJ Interlock) -->
  <g transform="translate(250, 250)">
    <!-- 'I' Column: Clean vertical pillar with angled precision terminals -->
    <path d="M -60 -125 
             L -24 -125 
             A 6 6 0 0 1 -18 -119 
             L -18 75 
             A 6 6 0 0 1 -24 81 
             L -60 81 
             A 6 6 0 0 1 -66 75 
             L -66 -119 
             A 6 6 0 0 1 -60 -125 Z" 
          fill="url(#cyberGrad)" />

    <!-- 'J' Flow: Descending stroke curving gracefully under the I -->
    <path d="M 22 -125 
             L 58 -125 
             A 6 6 0 0 1 64 -119 
             L 64 65 
             C 64 115, 20 145, -35 145 
             C -68 145, -92 135, -108 120 
             A 6 6 0 0 1 -108 110 
             L -84 86 
             A 6 6 0 0 1 -94 88
             C -84 96, -65 103, -35 103 
             C 5 103, 22 85, 22 55 
             L 22 -119 
             A 6 6 0 0 1 28 -125 Z" 
          fill="#FFFFFF" />

    <!-- Minimalist Accent Point (Dot of the I/J crest) -->
    <circle cx="-42" cy="-155" r="10" fill="#38BDF8" />
  </g>
</svg>
