<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="neonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Matte Background -->
  <rect width="500" height="500" rx="100" fill="#0A0B10" />

  <!-- Geometric Minimalist Monogram: Interlocking Hexagon 'IJ' -->
  <g transform="translate(250, 250)">
    <!-- Central Pillar 'I' -->
    <path d="M -30 -130 L 10 -130 L 10 130 L -30 130 Z" fill="url(#neonCyan)" />
    
    <!-- Outer Hook 'J' that forms an open geometric loop -->
    <path d="M 30 -130 
             L 70 -130 
             L 70 80 
             C 70 125, 30 155, -20 155 
             C -65 155, -95 125, -95 90 
             L -60 90 
             C -60 108, -42 122, -18 122 
             C 12 122, 34 104, 34 75 
             Z" 
          fill="url(#neonIndigo)" filter="url(#neonGlow)" opacity="0.95" />

    <!-- Pure geometric precision accent -->
    <circle cx="-10" cy="-160" r="10" fill="#00F2FE" />
  </g>
</svg>
