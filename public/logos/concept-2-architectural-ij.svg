<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="500" height="500" rx="100" fill="#090D16" />

  <!-- The Architectural IJ Monogram -->
  <g filter="url(#softShadow)">
    <!-- Column 'I' : Elegant rounded capsule -->
    <rect x="180" y="130" width="44" height="180" rx="22" fill="url(#prismGrad)" />
    <!-- Floating Crown Dot of 'I' -->
    <circle cx="202" cy="88" r="16" fill="#A855F7" />

    <!-- Sweeping 'J' : Parallel stem extending down and curving into a cradle -->
    <path d="M 276 130 
             L 276 290 
             C 276 345, 235 385, 175 385 
             C 145 385, 120 372, 105 352
             A 22 22 0 0 1 140 324
             C 148 335, 160 341, 175 341
             C 208 341, 232 318, 232 290
             L 232 130 
             A 22 22 0 0 1 276 130 Z" 
          fill="url(#silverGrad)" />
  </g>
</svg>
